server:
  port: ${PORT:8086}

spring:
  application:
    name: artagram-media-worker

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:artagram}
    password: ${RABBITMQ_PASSWORD:artagram_secret}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000

artagram:
  storage:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:artagram-uploads}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    path-style-access: ${S3_PATH_STYLE:true}
    local-dir: ${STORAGE_LOCAL_DIR:uploads}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
